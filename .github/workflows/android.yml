name: Fabriquer l'application Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
      - name: Compiler
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk "LisaDictee-${{ github.run_number }}.apk"
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lisa Dictée ${{ github.run_number }}
          body: Version fabriquée automatiquement depuis ${{ github.sha }}.
          files: LisaDictee-${{ github.run_number }}.apk
